# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package, which is what `package = false` says. Without a
# lockfile that names mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "developer"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

# Lint config for the hooks and their tests. This repo is not a Python
# package; there is nothing to build or install.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

# Loose files, not a package, so mypy is pointed at them by path.
[tool.mypy]
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["autonomous-agent"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/developer"
boot = "command"
boot-timeout = 600
boot-command = "labels() { podman image inspect --format \"{{index .Config.Labels \\\"$1\\\"}}\" \"$IMAGE\"; }\ntest \"$(labels org.opencontainers.image.version)\" = \"$(labels version)\"\npodman run --rm --entrypoint /bin/bash \\\n  --device /dev/fuse --security-opt label=disable \\\n  \"$IMAGE\" -c '\n  set -euxo pipefail\n  claude --version\n  claude-agent --version\n  python3 -c \"import sys; assert sys.version_info[:2] >= (3, 14), sys.version\"\n  uv --version\n  tmux -V\n  git --version\n  node --version\n  pre-commit --version\n  podman --version\n  bash -n /usr/local/bin/developer-entrypoint\n  bash -n /usr/local/bin/developer-worker-claude\n  test -x /usr/local/bin/developer-worker-claude\n  test -x /usr/libexec/developer/seat-state\n  test -x /usr/libexec/developer/ashigaru-hook\n  ashigaru --help > /dev/null\n  test \"$(rpm -q --qf \"%{VERSION}\" ashigaru)\" = 5.3.0\n  test \"$(python3 -c \"import ashigaru; print(ashigaru.__version__)\")\" = 5.3.0\n  test -f /etc/claude-code/.claude/skills/ashigaru/SKILL.md\n  grep -q \"^name: ashigaru$\" /etc/claude-code/.claude/skills/ashigaru/SKILL.md\n  test \"$ASHIGARU_URL\" = https://ashigaru.crunchtools.com\n  echo \"{}\" | /usr/libexec/developer/ashigaru-hook stop\n  python3 -m json.tool /etc/claude-code/managed-settings.d/40-developer-seat.json > /dev/null\n'\n"
