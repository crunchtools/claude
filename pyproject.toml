# The [project] table exists so `uv lock` can pin the gate's own tools; this
# repo is not a package, which is what `package = false` says. Without a
# lockfile that names mypy and pytest the gate exits 2 (python-sdlc,
# need_lock_dep) rather than reporting a pass it never ran.
[project]
name = "claude"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

# Lint config for the hooks and their tests. This repo is not a Python
# package; there is nothing to build or install.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90", "PLR"]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

# Loose files, not a package, so mypy is pointed at them by path.
[tool.mypy]
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent rather
# than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["autonomous-agent"]

[tool.sdlc.ci]
checks = ["developer-image", "boot-gate"]

# Builds ./Containerfile at localhost/claude:sdlc ([project] name) for the boot gate below.
[tool.sdlc.ci.developer-image]
kind = "image-build"

# The image's own assertions, run inside it with the entrypoint set to bash. The
# two version labels are compared by tests/test_containerfile.py instead: labels
# are not visible from inside the image. No --device /dev/fuse or label=disable
# here; the script needs neither.
[tool.sdlc.ci.boot-gate]
kind = "command"
image = "localhost/claude:sdlc"
argv = ["bash", "tests/image/boot-check.sh"]

[tool.sdlc.image]
# The repo's own name, which sdlc requires; it was developer until #41.
image = "quay.io/crunchtools/claude"
# A seat needs a Claude login and the Desk's key, so the publish job has nothing
# to start it with. The ci checks above (developer-image, boot-gate) are the gate.
boot = "none"
boot-none-reason = "a seat needs a login and the Desk's key; developer-image and boot-gate in [tool.sdlc.ci] run the image's assertions"
