# Gourmand exceptions. Each entry is a finding reviewed by hand and kept on
# purpose; the justification says why.

[[exceptions]]
check = "CH001-absolute_paths"
path = "deploy/josui.env.example"
justification = "An example env file for a container deployment. The values are the host paths of bind mounts, which podman requires to be absolute; they use placeholder service names."
classification = "by_design"

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"

# The one test of a read-only checkout (Dolza's shared one, mounted read-only
# into every seat but Josui Prime) makes .git mode 0555. Root writes through
# mode bits, so as root the condition cannot be built without a privileged
# read-only mount, which a unit test cannot make. Gourmand matches exceptions
# by path alone and ignores `pattern`, so the test has a file to itself.
[[exceptions]]
check = "EV003-test_skip_evasion"
path = "tests/test_skills_sync_readonly.py"
justification = "Root ignores the 0555 mode the test uses to make a checkout unwritable, and a real read-only mount needs privileges a unit test does not have; the test runs for every non-root user."
classification = "by_design"

# Same reason, for the gateway token file (#77): a 0000 file is unreadable to
# everyone but root, and nothing short of a privileged mount makes a regular
# file unreadable to root. Its own file, for the same reason.
[[exceptions]]
check = "EV003-test_skip_evasion"
path = "tests/test_entrypoint_unreadable.py"
justification = "Root reads through the 0000 mode the test uses to make the token file unreadable, and nothing short of a privileged mount changes that; the test runs for every non-root user."
classification = "by_design"

# Ledger entries quote the code they judge verbatim, and Gatehouse matches the
# quote against the diff, so a path in the code is a path in the ledger.
[[exceptions]]
check = "CH001-absolute_paths"
path = "gatehouse-findings.toml"
justification = "Evidence strings must quote the judged code exactly for Gatehouse to match them, so absolute paths in that code appear here verbatim."
classification = "by_design"
