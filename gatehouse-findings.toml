[[findings]]
agent = "consistency"
category = "quality"
file = "rootfs/usr/local/bin/claude-skills-sync"
evidence = "tmp=$(mktemp \"$status_file.XXXXXX\") || { log \"cannot write $status_file\"; exit 0; }"
status = "not-a-bug"
reason = "By design and documented in the header: a failed step is reported on stderr and the pass exits 0, because the entrypoint runs it at start under set -e and in the background loop, where a non-zero exit must not stop the seat. skills-sync-push is a one-shot unit whose failure systemd should record, so it exits 1."

[[findings]]
agent = "constitution"
category = "security"
file = "rootfs/usr/local/bin/developer-entrypoint"
evidence = "local keyfile=${JOSUI_GATEHOUSE_KEY_FILE:-/run/secrets/gatehouse-openrouter-key}"
status = "not-a-bug"
reason = "Only the host unit sets the seat's environment, and that unit already chooses every mount and secret the seat has, so the override grants nothing it lacks. It is the same test seam as JOSUI_SSH_DIR, and it keeps the tests off the real /run/secrets."

[[findings]]
agent = "tests"
category = "testing"
file = "rootfs/usr/local/bin/developer-entrypoint"
evidence = "OPENROUTER_API_KEY_FILE=$keyfile"
status = "not-a-bug"
reason = "The handoff is sdlc's half and is tested there: python-sdlc's tests/test_host_contract.sh (a968 PR) runs t_gatehouse against a gatehouse.env naming a key file and asserts the read-only mount, the env-file, and that the key value appears in no podman argument. This repo tests what it writes."

[[findings]]
agent = "security"
category = "security"
file = "Containerfile"
evidence = "RUN git config --system \\\n        'includeIf.hasconfig:remote.*.url:https://github.com/crunchtools/**.path' \\\n        /usr/share/developer/crunchtools-hooks.gitconfig && \\\n    pre-commit init-templatedir -t pre-commit -t pre-merge-commit -t pre-push"
status = "not-a-bug"
reason = "A repository cannot set its own remote URL: .git/config is never cloned, and origin is the URL the seat cloned from, which goes through the gateway to crunchtools on GitHub. Only something already running in the seat can change it."
