# Seats run with /var/tmp on a 1 GB tmpfs (#92), and buildah stages layers in
# /var/tmp unless told otherwise: a large image (torch, Caddy) fills it and the
# build dies "no space left on device". "storage" puts that staging under the
# graphroot's tmp directory, which is the seat's containers volume on disk.
# The entrypoint also exports TMPDIR=$HOME/tmp, which wins over this; this
# covers a shell from `podman exec` that never ran the entrypoint.
[engine]
image_copy_tmp_dir = "storage"
