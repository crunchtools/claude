# Where podman and buildah stage layers and build contexts: under the nested
# engine's storage (<graphroot>/tmp), not /var/tmp. The seat units mount
# /var/tmp as a 1 GB tmpfs -- a cap that keeps orphaned buildah dirs from
# counting against the seat's memory cgroup -- and a large `podman build`
# overran it with ENOSPC. The storage is a volume on disk, so this costs no RAM
# and leaves the cap where it is. TMPDIR, if set, still wins.
[engine]
image_copy_tmp_dir = "storage"
